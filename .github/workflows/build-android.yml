name: TGU Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgu-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android debug APK and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure optional persistent debug signing
        env:
          TGU_DEBUG_KEYSTORE_BASE64: ${{ secrets.TGU_DEBUG_KEYSTORE_BASE64 }}
          TGU_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.TGU_DEBUG_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$TGU_DEBUG_KEYSTORE_BASE64" && -n "$TGU_DEBUG_KEYSTORE_PASSWORD" ]]; then
            key_path="$RUNNER_TEMP/tgu-debug.jks"
            printf '%s' "$TGU_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            echo "TGU_DEBUG_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
            echo "TGU_DEBUG_KEYSTORE_PASSWORD=$TGU_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TGU_PERSISTENT_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Persistent signing is not configured: this CI build will not be distributed as an installable APK. Configure TGU_DEBUG_KEYSTORE_BASE64 and TGU_DEBUG_KEYSTORE_PASSWORD."
            echo "TGU_PERSISTENT_DEBUG_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Verify persistent signing certificate (when configured)
        if: env.TGU_PERSISTENT_DEBUG_SIGNING == 'true'
        shell: bash
        run: |
          expected="16:DD:84:A2:36:98:8D:08:EA:13:6B:2F:0F:6D:1A:C4:03:7C:01:2F:BC:1C:9E:1E:F1:94:3A:21:85:A9:B3:C7"
          actual="$(keytool -list -v -keystore "$TGU_DEBUG_KEYSTORE_PATH" -storepass "$TGU_DEBUG_KEYSTORE_PASSWORD" -alias tgu-debug | grep 'SHA256:' | head -n 1 | sed -E 's/.*SHA256:[[:space:]]*//')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Wrong TGU Android signing certificate. Use the pinned test signing keystore; do not rotate keys."
            exit 1
          fi

      - name: Build APK and run unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK (persistent signing only)
        if: env.TGU_PERSISTENT_DEBUG_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TGU-Android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TGU-Android-test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
