name: TGU Releases

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "desktop/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android 0.9.6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Require persistent Android signing for published APK
        env:
          TGU_DEBUG_KEYSTORE_BASE64: ${{ secrets.TGU_DEBUG_KEYSTORE_BASE64 }}
          TGU_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.TGU_DEBUG_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$TGU_DEBUG_KEYSTORE_BASE64" || -z "$TGU_DEBUG_KEYSTORE_PASSWORD" ]]; then
            echo "::error::TGU release signing secrets are missing. Refusing to publish an APK signed with an ephemeral runner key."
            echo "::error::Configure repository secrets TGU_DEBUG_KEYSTORE_BASE64 and TGU_DEBUG_KEYSTORE_PASSWORD with the SAME persistent key across releases."
            exit 1
          fi
          key_path="$RUNNER_TEMP/tgu-release-debug.jks"
          printf '%s' "$TGU_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          [[ -s "$key_path" ]] || { echo "::error::Decoded keystore is empty"; exit 1; }
          echo "TGU_DEBUG_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "TGU_DEBUG_KEYSTORE_PASSWORD=$TGU_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          # Do not print the keystore, password, or any private key material.

      - name: Build APK and run unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Verify pinned signing certificate and signed release APK
        shell: bash
        run: |
          expected="16:DD:84:A2:36:98:8D:08:EA:13:6B:2F:0F:6D:1A:C4:03:7C:01:2F:BC:1C:9E:1E:F1:94:3A:21:85:A9:B3:C7"
          actual="$(keytool -list -v -keystore "$TGU_DEBUG_KEYSTORE_PATH" -storepass "$TGU_DEBUG_KEYSTORE_PASSWORD" -alias tgu-debug | grep 'SHA256:' | head -n 1 | sed -E 's/.*SHA256:[[:space:]]*//')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Wrong Android signing certificate. Expected pinned SHA-256 $expected but got $actual. Do not rotate the release key."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/release/TGU-Android-v0.9.6-debug.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ runner.temp }}/release/TGU-Android-v0.9.6-debug.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows 0.3.1
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node dependencies
        run: npm install

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Generate Windows icon
        shell: pwsh
        run: |
          npm install --no-save sharp png-to-ico
          node --input-type=module -e "import sharp from 'sharp'; import pngToIco from 'png-to-ico'; import fs from 'node:fs'; const png = await sharp('public/tgu-icon.svg').resize(256, 256).png().toBuffer(); fs.mkdirSync('src-tauri/icons', { recursive: true }); fs.writeFileSync('src-tauri/icons/icon.ico', await pngToIco(png));"
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Windows icon was not generated" }

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable executable
        env:
          TGU_COMMUNITY_API_BASE_URL: ${{ vars.TGU_COMMUNITY_API_BASE_URL }}
        run: npm run tauri build -- --no-bundle

      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/release" | Out-Null
          Copy-Item "src-tauri/target/release/tgu-desktop.exe" "$env:RUNNER_TEMP/release/TGU-Desktop-v0.3.1-portable.exe"

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/release/TGU-Desktop-v0.3.1-portable.exe
          if-no-files-found: error
          retention-days: 3

  publish-android:
    name: Publish Android prerelease
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-android

      - name: Publish Android prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.9.6
          target_commitish: ${{ github.sha }}
          name: TGU Android 0.9.6
          prerelease: true
          make_latest: false
          body: |
            Android public test build for TGU 0.9.6.

            Signed with the persistent project debug keystore to support in-place
            updates on devices previously using that certificate. Existing
            installations signed by a DIFFERENT certificate cannot be updated
            without the original key and will require a one-time reinstall.
          files: release-android/TGU-Android-v0.9.6-debug.apk

  publish-windows:
    name: Publish Windows prerelease
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-windows

      - name: Publish Windows prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v0.3.1
          target_commitish: ${{ github.sha }}
          name: TGU Desktop 0.3.1
          prerelease: true
          make_latest: false
          body: |
            Windows portable public test build for TGU Desktop 0.3.1.
            The executable remains portable and unsigned by a Windows code
            signing certificate. Windows may warn about an unknown publisher.
          files: release-windows/TGU-Desktop-v0.3.1-portable.exe
