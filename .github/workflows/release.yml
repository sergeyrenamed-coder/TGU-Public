name: TGU Releases

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "desktop/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android 0.9.8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Require persistent Android signing for published APK
        env:
          TGU_DEBUG_KEYSTORE_BASE64: ${{ secrets.TGU_DEBUG_KEYSTORE_BASE64 }}
          TGU_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.TGU_DEBUG_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$TGU_DEBUG_KEYSTORE_BASE64" || -z "$TGU_DEBUG_KEYSTORE_PASSWORD" ]]; then
            echo "::error::TGU release signing secrets are missing. Refusing to publish an APK signed with an ephemeral runner key."
            echo "::error::Configure repository secrets TGU_DEBUG_KEYSTORE_BASE64 and TGU_DEBUG_KEYSTORE_PASSWORD with the SAME persistent key across releases."
            exit 1
          fi
          key_path="$RUNNER_TEMP/tgu-release-debug.jks"
          printf '%s' "$TGU_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          [[ -s "$key_path" ]] || { echo "::error::Decoded keystore is empty"; exit 1; }
          echo "TGU_DEBUG_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "TGU_DEBUG_KEYSTORE_PASSWORD=$TGU_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          # Do not print the keystore, password, or any private key material.

      - name: Check release metadata
        shell: bash
        run: |
          grep -q 'versionCode = 27' app/build.gradle.kts
          grep -q 'versionName = "0.9.8"' app/build.gradle.kts

      - name: Build APK and run unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Verify pinned signing certificate and signed release APK
        shell: bash
        run: |
          expected="16:DD:84:A2:36:98:8D:08:EA:13:6B:2F:0F:6D:1A:C4:03:7C:01:2F:BC:1C:9E:1E:F1:94:3A:21:85:A9:B3:C7"
          actual="$(keytool -list -v -keystore "$TGU_DEBUG_KEYSTORE_PATH" -storepass "$TGU_DEBUG_KEYSTORE_PASSWORD" -alias tgu-debug | grep 'SHA256:' | head -n 1 | sed -E 's/.*SHA256:[[:space:]]*//')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Wrong Android signing certificate. Expected pinned SHA-256 $expected but got $actual. Do not rotate the release key."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/release/TGU-Android-v0.9.8-debug.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ runner.temp }}/release/TGU-Android-v0.9.8-debug.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows 0.4.3
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node dependencies
        run: npm install

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Generate Windows icon
        shell: pwsh
        run: |
          npm install --no-save sharp png-to-ico
          node --input-type=module -e "import sharp from 'sharp'; import pngToIco from 'png-to-ico'; import fs from 'node:fs'; const png = await sharp('public/tgu-icon.svg').resize(256, 256).png().toBuffer(); fs.mkdirSync('src-tauri/icons', { recursive: true }); fs.writeFileSync('src-tauri/icons/icon.ico', await pngToIco(png));"
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Windows icon was not generated" }

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check release metadata
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($cfg.version -ne "0.4.3" -or $pkg.version -ne "0.4.3") { throw "TGU Desktop version mismatch" }

      - name: Build portable executable
        env:
          TGU_COMMUNITY_API_BASE_URL: ${{ vars.TGU_COMMUNITY_API_BASE_URL }}
        run: npm run tauri build -- --no-bundle

      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/release" | Out-Null
          Copy-Item "src-tauri/target/release/tgu-desktop.exe" "$env:RUNNER_TEMP/release/TGU-Desktop-v0.4.3-portable.exe"

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/release/TGU-Desktop-v0.4.3-portable.exe
          if-no-files-found: error
          retention-days: 3

  publish-android:
    name: Publish Android prerelease
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-android

      - name: Publish Android prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.9.8
          target_commitish: ${{ github.sha }}
          name: TGU Android 0.9.8 — Fast Connect
          prerelease: true
          make_latest: false
          body: |
            ## TGU Android 0.9.8 — Fast Connect и резервные прокси

            В этом обновлении TGU быстрее подключает Telegram и продолжает искать запасные прокси в фоне, пока основной уже используется.

            ### Что нового
            - **RU Verified** — приоритет серверов, проверенных российским узлом Yandex Cloud. Облачная отметка только подсказывает порядок: перед выбором TGU подтверждает доступность с телефона.
            - **Fast Connect** — быстрая проверка лучших RU-кандидатов и подключение первого локально подтверждённого upstream, не дожидаясь окончания полного сканирования каталога.
            - **Warm Standby** — фоновая проверка и временное хранение до пяти резервных серверов, пока Telegram уже работает.
            - **Автовосстановление** — при недоступности основного прокси TGU сначала повторно проверяет резерв, а затем при необходимости запускает обычный автоподбор.
            - **Каталог и диагностика** — RU-метки и сведения о проверке не заменяют результаты тестов в вашей сети.

            ### Установка и важные сведения
            - APK подписан постоянным тестовым сертификатом проекта для обновления поверх предыдущих совместимых сборок TGU; код версии **27**.
            - Если уже установленный TGU подписан другим сертификатом, Android не разрешит обычное обновление. Перед переустановкой сохраните нужные настройки.
            - TGU — локальный прокси для Telegram, **не системный VPN**. RU Verified не гарантирует доступность сервера на каждом операторе.
            - Сборка предварительная: сообщайте о неполадках через GitHub Issues.

            **RNMDTEAM · TGU Public**
          files: release-android/TGU-Android-v0.9.8-debug.apk

  publish-windows:
    name: Publish Windows prerelease
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-windows

      - name: Publish Windows prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v0.4.3
          target_commitish: ${{ github.sha }}
          name: TGU Desktop 0.4.3 — работа в трее
          prerelease: true
          make_latest: false
          body: |
            ## TGU Desktop 0.4.3 — новая версия для Windows

            Крупное обновление TGU Desktop: быстрый запуск прокси, обновлённый интерфейс, RNMD ID и полноценная работа в системном трее.

            ### Что нового
            - **Fast Connect и RU Verified** — быстрый выбор upstream с обязательной проверкой на ПК; рабочий прокси подключается до завершения проверки остальных.
            - **Warm Standby** — фоновая подготовка до пяти запасных прокси и перепроверка резерва при обрыве основного соединения.
            - **Новый интерфейс** — минималистичный чёрно-белый дизайн, сворачиваемая боковая панель с иконками (свёрнута при запуске), исправлена прокрутка и обновлена фирменная верхняя полоса окна.
            - **RNMD ID** — авторизация через Telegram в системном браузере, экран профиля, устройств и покупок; сессия хранится в зашифрованном виде (AES-256-GCM), ключ — в Windows Credential Manager.
            - **Работа в трее** — кнопка × и Alt+F4 скрывают окно, но не останавливают прокси-движок. В трее есть «Открыть TGU» и «Полностью выйти». Последний пункт корректно завершает работу.
            - **Улучшения стабильности** — версия отображается автоматически, сохранены настройки и параметры подключения.

            ### Установка и важные сведения
            - Скачайте **portable EXE** для Windows x64. Перед запуском новой сборки полностью завершите предыдущую версию TGU.
            - EXE не имеет коммерческой цифровой подписи издателя — Windows может показать предупреждение о неизвестном разработчике.
            - После закрытия окна кнопкой × TGU продолжает работать; для полного завершения используйте меню системного трея.
            - Приложение работает с Telegram через локальный прокси, а не заменяет системный VPN.
            - Релиз предварительный: сообщения об ошибках принимаются в GitHub Issues.

            **RNMDTEAM · TGU Public**
          files: release-windows/TGU-Desktop-v0.4.3-portable.exe
