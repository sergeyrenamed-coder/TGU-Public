<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
  <title id="title">Как работает TGU</title>
  <desc id="desc">Схема маршрута Telegram через локальный TGU Engine, выбранный MTProto или SOCKS5 прокси и сеть Telegram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.52" stop-color="#111111"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="whiteLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#777"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#777"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffffff" fill-opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#f5f5f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:800 58px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#fff}
      .subtitle{font:500 18px Arial,Helvetica,sans-serif;letter-spacing:5px;fill:#858585}
      .label{font:700 34px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#f7f7f7}
      .desc{font:400 22px Arial,Helvetica,sans-serif;fill:#a8a8a8}
      .chip{font:600 18px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#e8e8e8}
      .step{font:600 14px Arial,Helvetica,sans-serif;letter-spacing:3px;fill:#777}
      .node{fill:url(#panel);stroke:#777;stroke-opacity:.52;stroke-width:2}
      .nodeStrong{fill:url(#panel);stroke:#eee;stroke-opacity:.8;stroke-width:2}
      .chipBox{fill:#080808;stroke:#777;stroke-opacity:.55;stroke-width:1.5}
      .icon{fill:none;stroke:#eee;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1420" rx="28" fill="url(#background)"/>
  <rect width="1600" height="1420" rx="28" fill="url(#grid)"/>
  <path d="M80 80H1520" stroke="#fff" stroke-opacity=".18"/>
  <text x="120" y="158" class="title">КАК РАБОТАЕТ TGU</text>
  <text x="123" y="202" class="subtitle">TELEGRAM TRAFFIC ROUTING / LOCAL PROXY ENGINE</text>
  <text x="1480" y="158" text-anchor="end" class="step">RNMDTEAM / TGU</text>
  <g filter="url(#shadow)"><rect x="250" y="250" width="1100" height="174" rx="24" class="nodeStrong"/></g>
  <g transform="translate(330 288)">
    <rect x="0" y="0" width="90" height="126" rx="16" class="icon"/>
    <path d="M27 14H63M35 108H55" class="icon" stroke-width="2"/>
    <path d="M23 59L66 40L55 83L43 69L34 78L36 63Z" fill="#f4f4f4" fill-opacity=".9" stroke="#f4f4f4" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="500" y="324" class="label">TELEGRAM</text>
  <text x="500" y="366" class="desc">Android / Windows</text>
  <text x="1295" y="293" text-anchor="end" class="step">01 / CLIENT</text>
  <rect x="1110" y="328" width="190" height="50" rx="25" class="chipBox"/>
  <text x="1205" y="360" text-anchor="middle" class="chip">APP</text>
  <path d="M800 424V528" stroke="url(#whiteLine)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="675" y="448" width="250" height="52" rx="26" fill="#090909" stroke="#aaa" stroke-opacity=".65"/>
  <text x="800" y="481" text-anchor="middle" class="chip">127.0.0.1:1443</text>
  <g filter="url(#shadow)"><rect x="250" y="548" width="1100" height="280" rx="24" class="nodeStrong"/></g>
  <text x="330" y="612" class="step">02 / LOCAL GATEWAY</text>
  <text x="330" y="672" class="label">TGU ENGINE</text>
  <text x="330" y="710" class="desc">Local MTProto node</text>
  <g transform="translate(330 746)">
    <rect x="0" y="0" width="270" height="48" rx="12" class="chipBox"/>
    <text x="135" y="31" text-anchor="middle" class="chip">DIAGNOSTICS</text>
    <rect x="290" y="0" width="310" height="48" rx="12" class="chipBox"/>
    <text x="445" y="31" text-anchor="middle" class="chip">PROFILE SELECTION</text>
  </g>
  <g transform="translate(1112 618)">
    <circle cx="54" cy="54" r="47" fill="none" stroke="#777" stroke-width="2"/>
    <circle cx="54" cy="54" r="17" fill="none" stroke="#eee" stroke-width="3"/>
    <path d="M54 7V22M54 86V101M7 54H22M86 54H101M21 21L32 32M76 76L87 87M87 21L76 32M32 76L21 87" class="icon"/>
    <path d="M54 38V54L67 64" class="icon"/>
  </g>
  <path d="M800 828V926" stroke="url(#whiteLine)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="655" y="854" width="290" height="52" rx="26" fill="#090909" stroke="#aaa" stroke-opacity=".65"/>
  <text x="800" y="887" text-anchor="middle" class="chip">SELECTED UPSTREAM</text>
  <g filter="url(#shadow)"><rect x="250" y="946" width="1100" height="174" rx="24" class="node"/></g>
  <g transform="translate(330 978)">
    <rect x="0" y="0" width="90" height="110" rx="12" class="icon"/>
    <path d="M0 36H90M0 73H90" class="icon" stroke-width="2"/>
    <circle cx="17" cy="18" r="4" fill="#eee"/><circle cx="17" cy="55" r="4" fill="#eee"/><circle cx="17" cy="92" r="4" fill="#eee"/>
    <path d="M34 18H71M34 55H71M34 92H71" class="icon" stroke-width="2"/>
  </g>
  <text x="500" y="1020" class="label">MTProto / SOCKS5</text>
  <text x="500" y="1062" class="desc">Proxy server</text>
  <text x="1295" y="985" text-anchor="end" class="step">03 / UPSTREAM</text>
  <rect x="1080" y="1020" width="220" height="50" rx="25" class="chipBox"/>
  <text x="1190" y="1052" text-anchor="middle" class="chip">PROXY</text>
  <path d="M800 1120V1210" stroke="url(#whiteLine)" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="250" y="1230" width="1100" height="132" rx="24" class="nodeStrong"/></g>
  <g transform="translate(335 1260)">
    <circle cx="48" cy="34" r="31" class="icon"/>
    <path d="M17 34H79M48 3C60 16 60 52 48 65M48 3C36 16 36 52 48 65M22 16H74M22 52H74" class="icon" stroke-width="1.8"/>
  </g>
  <text x="500" y="1308" class="label">TELEGRAM NETWORK</text>
  <text x="1295" y="1270" text-anchor="end" class="step">04 / DESTINATION</text>
  <text x="1295" y="1314" text-anchor="end" class="desc">Encrypted Telegram connection</text>
  <path d="M80 1390H1520" stroke="#fff" stroke-opacity=".18"/>
</svg>